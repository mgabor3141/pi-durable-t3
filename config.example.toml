# pi-durable-t3 example host config.
#
# Location: ~/.config/pi-durable-t3/config.toml ($XDG_CONFIG_HOME), or <dir>/config.toml with --root <dir>.
# Data (storage, settings.json, projects.json, credentials) goes to ~/.local/share/pi-durable-t3/
# ($XDG_DATA_HOME), or <dir> with --root.
#
# Every key is optional; the values shown are the defaults. Unknown keys are an error.
# Projects and the default model are not set here: T3's UI edits them.

# listen = "127.0.0.1:3774"                 # facet address; a tailnet IP to reach it over Tailscale
# web = "http://127.0.0.1:5733"             # your T3 web app: a ready pairing link, and its origin may call
# instructions = "AGENTS.md"                # file added to every thread's system prompt, re-read each turn (relative to the data dir)

# [t3]
# label = "pi"                              # environment name shown in T3
# state_dir = "t3-auth"                     # pairing credentials, under the data dir
# token_ttl_days = 90                       # bearer-token lifetime
# cors_origins = ["t3code://app"]           # default: the desktop app plus `web`; [] allows any origin
