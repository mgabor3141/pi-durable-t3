# pi-durable-t3 example host config. Every key is optional; the values shown are the defaults. Unknown keys are an error.
#
# Location: ~/.config/pi-durable-t3/config.toml ($XDG_CONFIG_HOME), or <dir>/config.toml with --root <dir>.
# Data: ~/.local/share/pi-durable-t3/ ($XDG_DATA_HOME), or <dir> with --root:
#   durable.db, models-store.json   the agent's storage (pi-durable)
#   t3/                             the bridge's state: t3-settings.json, projects.json, auth.json, attachments/
#   scratch/                        "No project" threads' folders (agent work output)
# t3/ pairs with durable.db: back up and move them together.
# Projects and the default model are not set here; the T3 UI edits them.

# listen = "127.0.0.1:3774"                     # the API and the web app; a tailnet IP to reach it over Tailscale
# label = "pi"                                  # the computer's name in T3
# instructions = "AGENTS.md"                    # added to every thread's system prompt, re-read each turn (relative to the data dir)
# scratch_dir = "scratch"                       # "No project" root (relative to the data dir)
# token_ttl_days = 90                           # how long a paired device stays signed in
# cors_origins = ["t3code://app"]               # browser origins allowed to call cross-origin; [] allows any
# tailscale_serve = false                       # publish this host over Tailscale Serve: HTTPS on the tailnet
# tailscale_serve_port = 443                    # the HTTPS port Serve publishes on; it must not already be mapped (443 needs no port in the URL)
