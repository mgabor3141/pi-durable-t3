name: CI
# `next` is where work lands before `main` moves, so a failure shows there first.
on:
  push:
    branches: [main, next]
  pull_request:

# A newer push to the same branch replaces the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile   # runs `prepare`: T3's contracts and web app at the pin (network), then the build
      - run: pnpm typecheck
      - run: pnpm test
      # The browser smokes drive the real T3 web app; the runner's preinstalled Chrome stands in for /usr/bin/chromium.
      - run: FACET_PORT=5070 CHROMIUM="$(command -v google-chrome)" pnpm smoke
      - run: FACET_PORT=5072 CHROMIUM="$(command -v google-chrome)" bash dev/pack-proof.sh
